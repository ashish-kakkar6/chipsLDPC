<tspan x="830.0" dy="0">R<tspan baseline-shift="-25%" font-size="75%">i,j</tspan></tspan>
</text>
<text x="830.0" y="306" text-anchor="middle" class="label">
<tspan x="830.0" dy="0">M<tspan baseline-shift="-25%" font-size="75%">j</tspan></tspan>
</text>
<text x="830.0" y="426" text-anchor="middle" class="label">
<tspan x="830.0" dy="0">ê<tspan baseline-shift="-25%" font-size="75%">j</tspan></tspan>
</text>
<text x="30" y="240" text-anchor="start" class="small">
<tspan x="30" dy="0">CNU pair</tspan>
<tspan x="30" dy="23">+ metadata</tspan>
</text>
<path class="wire" d="M 30 278 L 135 278" marker-end="url(#arrow)"/>
<path class="wire" d="M 290 278 L 335 278" marker-end="url(#arrow)"/>
<circle cx="310" cy="278" r="3" fill="#4b6074"/>
<path class="wire" d="M 310 278 L 310 128 L 662 128 L 662 150" marker-end="url(#arrow)"/>
