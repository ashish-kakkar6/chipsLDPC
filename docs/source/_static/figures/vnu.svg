<tspan x="480" dy="0">own σ<tspan baseline-shift="-25%" font-size="75%">i,j</tspan> bypass</tspan>
</text>
<text x="420" y="202" text-anchor="middle" class="label">
<tspan x="420" dy="0">bias B<tspan baseline-shift="-25%" font-size="75%">j</tspan></tspan>
</text>
<path class="wire" d="M 420 213 L 420 240" marker-end="url(#arrow)"/>
<path class="wire" d="M 505 278 L 535 278"/>
<circle cx="535" cy="278" r="3" fill="#4b6074"/>
<text x="535" y="261" text-anchor="middle" class="label">
<tspan x="535" dy="0">T<tspan baseline-shift="-25%" font-size="75%">j</tspan></tspan>
</text>
<path class="wire" d="M 535 278 L 535 188 L 585 188" marker-end="url(#arrow)"/>
<path class="wire" d="M 535 278 L 535 300 L 585 300" marker-end="url(#arrow)"/>
<path class="wire" d="M 535 300 L 535 420 L 585 420" marker-end="url(#arrow)"/>
<circle cx="535" cy="300" r="3" fill="#4b6074"/>
<path class="wire" d="M 740 188 L 790 188" marker-end="url(#arrow)"/>
<path class="wire" d="M 740 300 L 790 300" marker-end="url(#arrow)"/>
<path class="wire" d="M 740 420 L 790 420" marker-end="url(#arrow)"/>
<text x="30" y="383" text-anchor="start" class="small">
<tspan x="30" dy="0">B<tspan baseline-shift="-25%" font-size="75%">j</tspan> = prior for vanilla.</tspan>
<tspan x="30" dy="23">Relay computes B<tspan baseline-shift="-25%" font-size="75%">j</tspan> from</tspan>
<tspan x="30" dy="23">prior + stored memory.</tspan>
</text>
<text x="30" y="488" text-anchor="start" class="small">
<tspan x="30" dy="0">Subtract and decide before clipping the stored marginal.</tspan>
<tspan x="30" dy="23">Ordinary iteration shown; Relay restart reloads R<tspan baseline-shift="-25%" font-size="75%">i,j</tspan> = +λ<tspan baseline-shift="-25%" font-size="75%">j</tspan>.</tspan>
</text>
</svg>
