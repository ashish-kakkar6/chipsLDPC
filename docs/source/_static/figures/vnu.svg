<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="535" viewBox="0 0 900 535" role="img" aria-labelledby="vnu-title vnu-desc">
<title id="vnu-title">VNU: one full-width total, three outputs</title>
<desc id="vnu-desc">A VNU reconstructs each signed check message from a shared minimum pair and edge metadata. A balanced adder combines these messages with the bias. The full-width total branches to per-edge subtraction and sign-magnitude clipping, signed marginal saturation, and a strict negative comparison. On an ordinary iteration the VNU state register commits the three outputs together. At a Relay restart, the edge-message register instead reloads the immutable prior, while the new marginal and decision still commit. The own-message subtraction bypass never uses the saturated marginal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b6074"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#16324f;font-size:17px} .small{font-size:15px;fill:#4b6074}.label{font-size:16px;font-weight:600;fill:#235fa4}.heading{font-size:25px;font-weight:700}.box-title{font-size:17px;font-weight:600}.wire{fill:none;stroke:#4b6074;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="900" height="535" fill="white"/>
<text x="30" y="39" text-anchor="start" class="heading">
<tspan x="30" dy="0">VNU · one total, three outputs</tspan>
</text>
<text x="30" y="68" text-anchor="start" class="small">
<tspan x="30" dy="0">Variable j · the same VariableNode serves vanilla and Relay BP</tspan>
</text>
<path d="M 30 84 H 870" stroke="#d4dfe8"/>
<text x="820" y="116" text-anchor="middle" class="label">
<tspan x="820" dy="0">State register</tspan>
</text>
<rect x="135" y="240" width="155" height="75" rx="9" fill="#f5f9fd" stroke="#235fa4" stroke-width="1.4"/>
<text x="212.5" y="268" text-anchor="middle" class="box-title">
<tspan x="212.5" dy="0">Select + convert</tspan>
</text>
<text x="212.5" y="288" text-anchor="middle" class="small">
<tspan x="212.5" dy="0">m<tspan baseline-shift="-25%" font-size="75%">1</tspan> / m<tspan baseline-shift="-25%" font-size="75%">2,</tspan> sign</tspan>
<tspan x="212.5" dy="19">→ signed σ<tspan baseline-shift="-25%" font-size="75%">i,j</tspan></tspan>
</text>
<rect x="335" y="240" width="170" height="75" rx="9" fill="#f5f9fd" stroke="#235fa4" stroke-width="1.4"/>
<text x="420.0" y="268" text-anchor="middle" class="box-title">
<tspan x="420.0" dy="0">Shared adder</tspan>
</text>
<text x="420.0" y="288" text-anchor="middle" class="small">
<tspan x="420.0" dy="0">full-width total T<tspan baseline-shift="-25%" font-size="75%">j</tspan></tspan>
</text>
<rect x="585" y="150" width="155" height="75" rx="9" fill="#f5f9fd" stroke="#235fa4" stroke-width="1.4"/>
<text x="662.5" y="178" text-anchor="middle" class="box-title">
<tspan x="662.5" dy="0">Per-edge output</tspan>
</text>
<text x="662.5" y="198" text-anchor="middle" class="small">
<tspan x="662.5" dy="0">T<tspan baseline-shift="-25%" font-size="75%">j</tspan> − own σ<tspan baseline-shift="-25%" font-size="75%">i,j</tspan></tspan>
<tspan x="662.5" dy="19">clip + sign/mag</tspan>
</text>
<rect x="585" y="270" width="155" height="60" rx="9" fill="#f5f9fd" stroke="#235fa4" stroke-width="1.4"/>
<text x="662.5" y="298" text-anchor="middle" class="box-title">
<tspan x="662.5" dy="0">Stored marginal</tspan>
</text>
<text x="662.5" y="318" text-anchor="middle" class="small">
<tspan x="662.5" dy="0">signed saturation</tspan>
</text>
<rect x="585" y="390" width="155" height="60" rx="9" fill="#f5f9fd" stroke="#235fa4" stroke-width="1.4"/>
<text x="662.5" y="418" text-anchor="middle" class="box-title">
<tspan x="662.5" dy="0">Hard decision</tspan>
</text>
<text x="662.5" y="438" text-anchor="middle" class="small">
<tspan x="662.5" dy="0">T<tspan baseline-shift="-25%" font-size="75%">j</tspan> &lt; 0</tspan>
</text>
<rect x="790" y="140" width="80" height="325" rx="8" fill="#eaf5f5" stroke="#167d8d" stroke-width="1.7"/>
<path d="M 790 434 l 10 8 l -10 8" fill="none" stroke="#167d8d" stroke-width="1.7"/>
