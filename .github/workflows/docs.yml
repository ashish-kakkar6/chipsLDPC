name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "src/main/scala/chipsldpc/**"
      - "src/test/scala/chipsldpc/**"
      - "scripts/**"
      - "examples/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "src/main/scala/chipsldpc/**"
      - "src/test/scala/chipsldpc/**"
      - "scripts/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: >-
          python -m sphinx -n -W --keep-going -b html
          docs/source docs/_build/html

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GITHUB_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GITHUB_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GITHUB_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
