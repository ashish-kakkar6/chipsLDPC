name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "src/main/scala/chipsldpc/**"
      - "src/test/scala/chipsldpc/**"
      - "scripts/**"
      - "examples/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "src/main/scala/chipsldpc/**"
      - "src/test/scala/chipsldpc/**"
      - "scripts/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: >-
          python -m sphinx -n -W --keep-going -b html
          docs/source docs/_build/html

      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "403" ] || [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected GitHub Pages API status: $status" >&2
            exit 1
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
